name: Release rules snapshot
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed tag to package
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Require completed CI for the exact tagged source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || exit 1
          [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" == "$(git rev-parse HEAD)" ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$(git rev-parse HEAD)&status=success&per_page=20" --jq '.workflow_runs | any(.event == "push" or .event == "workflow_dispatch")' | grep -qx true
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then echo 'Release already exists; inspect it before retrying.' >&2; exit 1; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .tools
          key: formal-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchain.json') }}
      - run: python3 scripts/setup-tools.py
      - name: Recheck and package source with emitted rules
        run: |
          export PATH="$PWD/.tools/bend/bin:$PWD/.tools/lean-4.34.0-linux/bin:$PATH"
          python3 scripts/check-rules.py
          scripts/ci-export
          mkdir -p .build/release/rules
          git archive HEAD | tar -x -C .build/release/rules
          mkdir -p .build/release/rules/generated
          cp .build/host/core.mjs .build/release/rules/generated/host.mjs
          cp .build/lifecycles/core.mjs .build/release/rules/generated/lifecycle.mjs
          git rev-parse HEAD > .build/release/rules/generated/source.txt
          tar -czf .build/release/rules.tar.gz -C .build/release rules
          sha256sum .build/release/rules.tar.gz > .build/release/rules.tar.gz.sha256
      - name: Publish the reviewed snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --title "Rules $RELEASE_TAG" --notes "Source and emitted rule modules. The exact source passed the bounded rules and host CI; application qualification remains claim-specific." .build/release/rules.tar.gz .build/release/rules.tar.gz.sha256
