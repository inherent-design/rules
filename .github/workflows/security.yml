name: Source security
on:
  workflow_dispatch:
  schedule:
    - cron: '28 8 * * 1'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5
        with:
          version: '2026.11.10'
          install_args: aqua:aquasecurity/trivy
      - name: Scan source
        run: |
          mkdir -p .build/security
          trivy fs --scanners vuln,misconfig,secret --skip-dirs .build,.tools,node_modules --format sarif --output .build/security/trivy.sarif --severity HIGH,CRITICAL --exit-code 1 .
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always()
        with:
          sarif_file: .build/security/trivy.sarif
