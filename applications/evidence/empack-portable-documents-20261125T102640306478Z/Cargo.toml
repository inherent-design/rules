[package]
name="rules-document-study"
version="0.0.0"
edition="2024"
[lib]
crate-type=["cdylib","rlib"]
[dependencies]
empack-core={path="core"}
anyhow={version="=1.0.104"}
serde={version="=1.0.229",features=["derive"]}
serde_json={version="=1.0.154"}
serde-saphyr={version="=2.2.0"}
sha2={version="=0.11.1"}
thiserror={version="=2.0.21"}
reqwest={package="url",version="=2.5.8"}
[profile.dev]
debug=0
opt-level=0
incremental=false
strip="symbols"
panic="abort"
